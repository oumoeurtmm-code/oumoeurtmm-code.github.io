<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Tracker · Oumoeurt Mousa</title>
  <meta name="description" content="Cloud Engineering and FinOps project tracker for Oumoeurt Mousa." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1720;
      --bg-2: #121c26;
      --surface: #16212c;
      --surface-2: #1a2733;
      --surface-3: #223241;
      --border: #2a3947;
      --border-soft: rgba(255,255,255,0.08);
      --text: #e8eef5;
      --muted: #a3b2c0;
      --subtle: #7f8c98;
      --accent: #ff9900;
      --accent-soft: rgba(255,153,0,0.12);
      --success: #6ac091;
      --success-soft: rgba(106,192,145,0.12);
      --warning: #ffbc57;
      --warning-soft: rgba(255,188,87,0.12);
      --planned: #89a0b6;
      --planned-soft: rgba(137,160,182,0.12);
      --aws: #59b8ff;
      --aws-soft: rgba(89,184,255,0.12);
      --finops: #7cd4a2;
      --finops-soft: rgba(124,212,162,0.12);
      --automation: #c496ff;
      --automation-soft: rgba(196,150,255,0.12);
      --shadow: 0 12px 36px rgba(0,0,0,0.22);
      --max: 1160px;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0d141b 0%, #101922 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a, button { color: inherit; text-decoration: none; font: inherit; }
    button { background: none; border: 0; cursor: pointer; }

    .container {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    .mono,
    .eyebrow,
    .toolbar-btn,
    .status-badge,
    .category-chip,
    .tag,
    .stat-label,
    .tier-index,
    .back-link,
    .footer-link,
    .status-line,
    .mini-btn,
    .summary-chip {
      font-family: 'IBM Plex Mono', monospace;
    }

    .eyebrow {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 32, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-soft);
    }

    .nav-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand span { color: var(--accent); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back-link {
      font-size: 13px;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .back-link:hover { color: var(--text); }

    .mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      transition: 0.2s ease;
    }

    .mini-btn:hover {
      color: var(--text);
      border-color: #465563;
      background: rgba(255,255,255,0.05);
    }

    .hero {
      padding: 72px 0 28px;
      border-bottom: 1px solid var(--border-soft);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.95fr;
      gap: 24px;
      align-items: start;
    }

    h1 {
      margin-top: 14px;
      font-size: clamp(38px, 6vw, 60px);
      line-height: 1.04;
      letter-spacing: -0.03em;
      max-width: 11ch;
    }

    .lead {
      margin-top: 20px;
      font-size: 18px;
      color: var(--muted);
      max-width: 64ch;
    }

    .hero-actions,
    .summary-row,
    .footer-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-actions {
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border);
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #11161c;
      border-color: var(--accent);
    }

    .btn-primary:hover { filter: brightness(1.05); }

    .btn-secondary {
      background: transparent;
      color: var(--text);
    }

    .btn-secondary:hover,
    .project-link:hover {
      background: rgba(255,255,255,0.03);
      border-color: #415261;
    }

    .panel,
    .metric,
    .toolbar,
    .tier-block,
    .project-card,
    .footer-box,
    .empty-state,
    .update-bar {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.015));
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }

    .panel,
    .toolbar,
    .footer-box,
    .empty-state,
    .update-bar {
      padding: 20px;
    }

    .overview {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .metric {
      padding: 18px;
    }

    .metric-wide {
      grid-column: 1 / -1;
    }

    .stat-label {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--subtle);
      margin-bottom: 10px;
    }

    .metric .value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .metric .label {
      font-size: 14px;
      color: var(--muted);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin: 14px 0 10px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff9900 0%, #ffbc57 100%);
      transition: width 0.35s ease;
    }

    .section {
      padding: 24px 0 0;
    }

    .update-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .status-line {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .summary-chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,153,0,0.22);
      background: var(--accent-soft);
      color: #ffbc57;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .toolbar {
      display: grid;
      gap: 18px;
    }

    .toolbar-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
      flex-wrap: wrap;
    }

    .toolbar-head h2 {
      font-size: 22px;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .toolbar-head p {
      color: var(--muted);
      font-size: 14px;
      max-width: 64ch;
    }

    .toolbar-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.03em;
      transition: 0.2s ease;
    }

    .toolbar-btn:hover {
      color: var(--text);
      border-color: #465563;
    }

    .toolbar-btn.active {
      color: #11161c;
      background: var(--accent);
      border-color: var(--accent);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex: 0 0 auto;
    }

    .board {
      display: grid;
      gap: 18px;
      padding-bottom: 40px;
    }

    .tier-block {
      overflow: hidden;
    }

    .tier-header {
      width: 100%;
      text-align: left;
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 16px;
      align-items: center;
      padding: 20px 22px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .tier-header:hover {
      background: rgba(255,255,255,0.02);
    }

    .tier-index {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #11161c;
    }

    .tier-copy h3 {
      font-size: 20px;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }

    .tier-copy p,
    .tier-summary,
    .tier-toggle {
      color: var(--muted);
      font-size: 14px;
    }

    .tier-toggle {
      transition: transform 0.25s ease;
    }

    .tier-block.collapsed .tier-toggle {
      transform: rotate(-90deg);
    }

    .tier-projects {
      padding: 18px;
      display: grid;
      gap: 14px;
      max-height: 2200px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.25s ease;
    }

    .tier-block.collapsed .tier-projects {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .project-card {
      padding: 18px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: start;
      min-height: 146px;
    }

    .project-card.done {
      opacity: 0.72;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .status-badge:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .project-title {
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .project-card.done .project-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .project-desc {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
      max-width: 70ch;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tag {
