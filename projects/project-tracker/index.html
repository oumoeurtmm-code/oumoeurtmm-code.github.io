<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Tracker · Oumoeurt Mousa</title>
  <meta name="description" content="Cloud Engineering and FinOps project tracker for Oumoeurt Mousa." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1720;
      --bg-2: #121c26;
      --surface: #16212c;
      --surface-2: #1a2733;
      --surface-3: #223241;
      --border: #2a3947;
      --border-soft: rgba(255,255,255,0.08);
      --text: #e8eef5;
      --muted: #a3b2c0;
      --subtle: #7f8c98;
      --accent: #ff9900;
      --accent-soft: rgba(255,153,0,0.12);
      --success: #6ac091;
      --success-soft: rgba(106,192,145,0.12);
      --warning: #ffbc57;
      --warning-soft: rgba(255,188,87,0.12);
      --planned: #89a0b6;
      --planned-soft: rgba(137,160,182,0.12);
      --aws: #59b8ff;
      --aws-soft: rgba(89,184,255,0.12);
      --finops: #7cd4a2;
      --finops-soft: rgba(124,212,162,0.12);
      --automation: #c496ff;
      --automation-soft: rgba(196,150,255,0.12);
      --shadow: 0 12px 36px rgba(0,0,0,0.22);
      --max: 1160px;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0d141b 0%, #101922 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a, button { color: inherit; text-decoration: none; font: inherit; }
    button { background: none; border: 0; cursor: pointer; }

    .container {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    .mono,
    .eyebrow,
    .toolbar-btn,
    .status-badge,
    .category-chip,
    .tag,
    .stat-label,
    .tier-index,
    .back-link,
    .footer-link {
      font-family: 'IBM Plex Mono', monospace;
    }

    .eyebrow {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 32, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-soft);
    }

    .nav-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand span { color: var(--accent); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .back-link {
      font-size: 13px;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .back-link:hover { color: var(--text); }

    .hero {
      padding: 72px 0 36px;
      border-bottom: 1px solid var(--border-soft);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.95fr;
      gap: 24px;
      align-items: start;
    }

    h1 {
      margin-top: 14px;
      font-size: clamp(38px, 6vw, 60px);
      line-height: 1.04;
      letter-spacing: -0.03em;
      max-width: 11ch;
    }

    .lead {
      margin-top: 20px;
      font-size: 18px;
      color: var(--muted);
      max-width: 64ch;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--border);
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #11161c;
      border-color: var(--accent);
    }

    .btn-primary:hover { filter: brightness(1.05); }

    .btn-secondary {
      background: transparent;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.03);
      border-color: #415261;
    }

    .panel,
    .metric,
    .toolbar,
    .tier-block,
    .project-card,
    .footer-box,
    .empty-state {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.015));
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }

    .panel,
    .toolbar,
    .footer-box,
    .empty-state {
      padding: 20px;
    }

    .overview {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .metric {
      padding: 18px;
    }

    .metric-wide {
      grid-column: 1 / -1;
    }

    .stat-label {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--subtle);
      margin-bottom: 10px;
    }

    .metric .value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .metric .label {
      font-size: 14px;
      color: var(--muted);
    }
